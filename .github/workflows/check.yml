name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check theme versions against the registry
        env:
          SITES_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: sh scripts/check-registry.sh
