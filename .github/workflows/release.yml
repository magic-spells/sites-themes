name: Release

# Each theme is released on its own. A tag <name>/v<version> (company/v0.2.0)
# zips that one folder, theme files at the zip root, and attaches the zip and
# its SHA-256 to a release named after the tag. Several such tags may sit on
# one commit. The repo itself has no version.
#
# The tag is provenance: Sites installs from its registry, where a release is
# published through the Publisher page or scripts/publish-history.sh, and
# scripts/zip.sh builds the same bytes locally. A published zip must never
# change: fix a mistake with a new tag, never by re-uploading.

on:
  push:
    tags: ['*/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read the tag
        id: tag
        run: |
          set -eu
          tag=$GITHUB_REF_NAME
          name=${tag%/*}
          version=${tag##*/}
          version=${version#v}
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $tag: \"$version\" is not a semver version (want <name>/v1.2.3)"
            exit 1
          fi
          if [ ! -f "$name/settings/theme.json" ]; then
            echo "::error::tag $tag: no theme folder $name/ with a settings/theme.json"
            exit 1
          fi
          theme_version=$(jq -r '.version // ""' "$name/settings/theme.json")
          if [ "$theme_version" != "$version" ]; then
            echo "::error::tag $tag: $name/settings/theme.json says version $theme_version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        id: zip
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eu
          file=$NAME-v$VERSION
          # scripts/zip.sh is the one recipe, so a zip built on a laptop at the tag
          # has the same bytes and the same hash as this one.
          (cd "$RUNNER_TEMP" && sh "$GITHUB_WORKSPACE/scripts/zip.sh" "$NAME" &&
            sha256sum "$file.zip" | cut -d ' ' -f 1 > "$file.sha256")
          # The release notes are this version's section of the theme's changelog.
          awk -v v="$VERSION" '/^## / { on = ($2 == v); next } on' "$NAME/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::$NAME/CHANGELOG.md has no ## $VERSION section"
            exit 1
          fi
          echo "zip=$RUNNER_TEMP/$file.zip" >> "$GITHUB_OUTPUT"
          echo "sha=$RUNNER_TEMP/$file.sha256" >> "$GITHUB_OUTPUT"
          echo "$file.zip sha256 $(cat "$RUNNER_TEMP/$file.sha256")" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$GITHUB_REF_NAME" "${{ steps.zip.outputs.zip }}" "${{ steps.zip.outputs.sha }}"
